name: Crawl ref

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to crawl (same-origin assets are saved to ref/)"
        default: "https://aether.cx"
      extra_origins:
        description: "Comma-separated extra origins to follow"
        default: ""
      probe_origins:
        description: "Comma-separated extra backend origins to probe (found ones are probed automatically)"
        default: ""
      workers:
        description: "Parallel requests"
        default: "8"
      max_files:
        description: "Max files to crawl"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: crawl-ref
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl page into ref/ (aether.cx headers, request discovery, backend probes)
        env:
          CRAWL_URL: ${{ inputs.url || 'https://aether.cx' }}
          MAX_FILES: ${{ inputs.max_files || '2000' }}
          EXTRA_ORIGINS: ${{ inputs.extra_origins }}
          PROBE_ORIGINS: ${{ inputs.probe_origins }}
          WORKERS: ${{ inputs.workers || '8' }}
        run: |
          python scripts/crawl_ref.py

      - name: Map the providers library exports (used by player.html)
        continue-on-error: true
        env:
          CRAWL_URL: ${{ inputs.url || 'https://aether.cx' }}
        run: python scripts/ref_providers.py

      - name: Commit ref/ to main
        env:
          CRAWL_URL: ${{ inputs.url || 'https://aether.cx' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ref
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ref/ crawl of ${CRAWL_URL}"
            git pull --rebase origin main
            git push origin main
          fi
