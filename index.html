}
async function pickWisp(network, say = () => {}, opts = {}) {
  const budgetMs = opts.budgetMs || 15000;
  const excluded = new Set((opts.exclude || []).map(toWss));
  const allowed = (entry) => !excluded.has(toWss(entry));
  const prefer = (list) => {
    const ok = list.filter(allowed);
    return [...ok.filter((e) => !bad.has(e)), ...ok.filter((e) => bad.has(e))];
  };
  const apply = (entry) => {
    const url = toWss(entry);
    network.set_websocket(url);
    try { network.set_wisp_pool([url]); } catch {}
    store.set("WB_LAST", { entry, ts: Date.now() });
    return url;
  };
  const search = async () => {
    const last = store.get("WB_LAST");
    if (last && last.entry && allowed(last.entry) && !bad.has(last.entry) && Date.now() - last.ts < 600000 && (await probeWisp(last.entry)) !== null) return apply(last.entry);

    say("Syncing wisp list…");
    const synced = await syncStorageList(opts.storageBases ? [...opts.storageBases, ...STORAGE_MIRRORS.filter((m) => !opts.storageBases.includes(m))] : STORAGE_MIRRORS);
    const all = prefer([...new Set([...synced, ...BUILTIN])]);
    const primary = all.filter((e) => !isBackup(e));
    const hit = await firstAlive(primary, say, "Testing wisp servers");
    if (hit) return apply(hit.entry);

    say("Trying backup wisps…");
    const remote = await fetchWispList(opts.kstuffBases ? [...opts.kstuffBases, ...KSTUFF_MIRRORS.filter((m) => !opts.kstuffBases.includes(m))] : KSTUFF_MIRRORS);
    const backups = prefer([...new Set([...all.filter(isBackup), FALLBACK, ...shuffle(remote.filter((u) => !all.includes(u))).slice(0, 16)])]);
    const bhit = await firstAlive(backups, say, "Testing backup wisps");
    if (bhit) return apply(bhit.entry);
    return null;
  };
  const timeout = new Promise((r) => setTimeout(() => r(null), budgetMs));
  try {
    const url = await Promise.race([search(), timeout]);
    if (url) return url;
  } catch (e) { console.warn("[wisp] pick failed", e); }
  console.warn("[wisp] no wisp validated, using fallback");
  return apply([FALLBACK, ...BUILTIN.filter(isBackup)].find(allowed) || FALLBACK);
}

async function verifyWisp(libcurl) {

async function connectWisp(st, say, log) {

    const wisp = await pickWisp(st.network, say, { exclude: st.tried, budgetMs: 12000 });
    say("Checking proxy…");
    try { const ms = await verifyWisp(st.libcurl); log("[proxy] wisp", String(wisp), ms + "ms"); st.wisp = String(wisp); return; }
    catch (e) { log("[proxy] wisp failed check", String(wisp), (e && e.message) || e); bad.add(wisp); st.tried.push(wisp); }

function getProxy({ log = () => {}, say = () => {} } = {}) {
  return (ready ||= (async () => {
    const t0 = Date.now(), say2 = (t) => say(t + " (" + Math.round((Date.now() - t0) / 1000) + "s)");
    say2("Loading proxy…");
    const sandstone = await loadSandstone(log);
    provisionalWisp(sandstone.network);
    for (let i = 0; i < 150 && !sandstone.libcurl.ready; i++) await new Promise((r) => setTimeout(r, 100));
    if (!sandstone.libcurl.ready) throw new Error("libcurl did not load");
    state = { libcurl: sandstone.libcurl, network: sandstone.network, wisp: "", tried: [] };
    await connectWisp(state, say2, log);
    return state;
  })().catch((e) => { ready = null; throw e; }));
}
async function rotateProxy(log = () => {}, say = () => {}) {
  if (!state) return getProxy({ log, say });
  if (rotating) return rotating;
  rotating = (async () => {
    log("[proxy] switching wisp");
    if (state.wisp) { bad.add(state.wisp); state.tried.push(state.wisp); }
    if (state.tried.length > 6) state.tried.length = 0;

function limiter(n) {
  let active = 0;
  const q = [];
  const next = () => {
    while (active < n && q.length) {
      const { fn, res, rej } = q.shift();
      active++;
      fn().then(res, rej).finally(() => { active--; next(); });
    }
  };
  return (fn) => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}

async function px(url, init = {}, ms = 45000) {
  const attempt = async () => {
    const { libcurl } = await getProxy({ log, say });
    return withTimeout(libcurl.fetch(url, { method: "GET", redirect: "follow", ...init }), ms, "Request");
  };
  const before = state && state.wisp;
  try {
    return await attempt();
  } catch (e) {
    const m = msgOf(e);
    if (!/error code (6|7|28|35|52|55|56)\b|timed out|websocket|wisp/i.test(m)) throw e;
    if (state && state.wisp !== before) return attempt();
    log("[proxy] request failed (" + m + "), switching proxy and retrying once");
    await rotateProxy(log, say);
    return attempt();
  }
}

let token = "";
async function getToken() {
  if (token) return token;
  const own = store.get("AE_TMDB");
  if (typeof own === "string" && own.trim()) return (token = own.trim());
  const auto = store.get("AE_TMDB_AUTO");
  if (auto && auto.v && Date.now() - auto.ts < 7 * 86400000) return (token = auto.v);
  say("Reading Aether's config…");
  const page = await (await px(SITE + "/", { headers: { accept: "text/html" } })).text();
  const m = page.match(/<script[^>]*\ssrc=["']([^"']*\/assets\/index-[^"']+\.js)["']/i) || page.match(/<script[^>]+type=["']module["'][^>]*\ssrc=["']([^"']+)["']/i);
  if (!m) throw new Error("Could not find Aether's app script. Set your own TMDB token with the link at the bottom.");
  say("Reading Aether's app bundle…");
  const js = await (await px(new URL(m[1], SITE + "/").href, { headers: { accept: "*/*" } }, 120000)).text();
  const k = js.match(/TMDB_READ_API_KEY\s*:\s*"(eyJ[\w.\-]+)"/);

const mem = new Map();
const apiLimit = limiter(6);
function tmdb(path, params = {}) {
  const qs = new URLSearchParams({ language: LANG, ...params }).toString();
  const key = path + "?" + qs;
  if (mem.has(key)) return mem.get(key);
  const p = apiLimit(async () => {
    const t = await getToken();
    let err;
    for (const base of TMDB_BASES) {
      try {
        const r = await px(base + path + "?" + qs, { headers: { accept: "application/json", Authorization: "Bearer " + t } });
        if (r.status === 401) {
          token = "";
          store.set("AE_TMDB_AUTO", null);
          throw new Error("TMDB rejected the token. Set your own with the link at the bottom.");
        }
        if (!r.ok) throw new Error("TMDB HTTP " + r.status);
        return await withTimeout(r.json(), 30000, "Response");
      } catch (e) {
        err = e;
        if (/rejected the token/.test(msgOf(e))) break;
      }
    }
    throw err;
  });
  mem.set(key, p);
  p.catch(() => mem.delete(key));
  return p;
}

function cached(key, ttl, load) {
  const hit = store.get("AE_C_" + key);
  if (hit && hit.ts && Date.now() - hit.ts < ttl && hit.v != null) return Promise.resolve(hit.v);
  return load().then((v) => { store.set("AE_C_" + key, { ts: Date.now(), v }); return v; });
}

    if (started) return;

const QORDER = (k) => (k === "4k" ? 2160 : k === "unknown" ? 0 : parseInt(k, 10) || 1);
const player = { hls: null, video: null, ui: null, quals: null, qHeaders: {}, caps: [], note: () => {} };



let hlsReady = null;
function loadHls() {
  if (window.Hls) return Promise.resolve(window.Hls);
  return (hlsReady ||= (async () => {
    const urls = ["https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js", "https://fastly.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"];
    const inject = (src) => new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = res;
      s.onerror = () => rej(new Error("script failed"));
      document.head.append(s);
    });
    for (const u of urls) {
      try {
        const r = await px(u, { headers: { accept: "*/*" } }, 60000);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const code = await r.text();
        await inject(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
        if (window.Hls) return window.Hls;
      } catch {}
    }
    for (const u of urls) {
      try { await inject(u); if (window.Hls) return window.Hls; } catch {}
    }
    throw new Error("Could not load the HLS library");
  })().catch((e) => { hlsReady = null; throw e; }));
}

function makeLoader(extra) {
  return class ProxyLoader {
    constructor() {
      this.stats = { aborted: false, loaded: 0, retry: 0, total: 0, chunkCount: 0, bwEstimate: 0, loading: { start: 0, first: 0, end: 0 }, parsing: { start: 0, end: 0 }, buffering: { start: 0, first: 0, end: 0 } };
      this.dead = false;
    }
    destroy() { this.dead = true; }
    abort() { this.dead = true; this.stats.aborted = true; }
    getCacheAge() { return null; }
    getResponseHeader() { return null; }
    load(context, config, callbacks) {
      const st = this.stats;
      st.loading.start = performance.now();
      const headers = { accept: "*/*", ...(context.headers || {}), ...extra };
      if (context.rangeStart != null && context.rangeEnd != null) headers.Range = "bytes=" + context.rangeStart + "-" + (context.rangeEnd - 1);
      const asText = context.responseType === "text" || context.responseType === "json";
      (async () => {
        const r = await px(context.url, { headers }, 45000);
        if (this.dead) return;
        if (!r.ok) {
          callbacks.onError({ code: r.status, text: "HTTP " + r.status }, context, r, st);
          return;
        }
        st.loading.first = performance.now();
        const data = asText ? await r.text() : await r.arrayBuffer();
        if (this.dead) return;
        st.loading.end = performance.now();
        st.loaded = st.total = asText ? data.length : data.byteLength;
        callbacks.onSuccess({ url: r.url || context.url, data }, st, context, r);
      })().catch((e) => {
        if (!this.dead) callbacks.onError({ code: 0, text: msgOf(e) }, context, null, st);
      });
    }
  };
}

function stopPlayer() {
  if (player.hls) { try { player.hls.destroy(); } catch {} player.hls = null; }
  const v = player.video;
  if (v) {
    try {
      v.onerror = null;
      v.pause();
      v.querySelectorAll("track").forEach((t) => t.remove());
      v.removeAttribute("src");
      v.load();
    } catch {}
  }
}

async function blobFallback(url, headers) {
  player.note("Direct playback failed, buffering through the proxy…");
  const r = await px(url, { headers: { accept: "*/*", ...headers } }, 60000);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const hd = (k) => (r.headers && r.headers.get ? r.headers.get(k) : null);
  const total = Number(hd("content-length")) || 0;
  const ct = hd("content-type") || "";
  const type = /^video\//.test(ct) ? ct : "video/mp4";
  const LIMIT = 1.5e9;
  if (total > LIMIT) throw new Error("file is too large to buffer in the browser");
  if (!r.body || !r.body.getReader) return URL.createObjectURL(await r.blob());
  const rd = r.body.getReader();
  const parts = [];
  let got = 0;
  for (;;) {
    const { value, done } = await rd.read();
    if (done) break;
    parts.push(value);
    got += value.length;
    if (got > LIMIT) { rd.cancel(); throw new Error("file is too large to buffer in the browser"); }
    player.note("Buffering " + Math.round(got / 1048576) + (total ? " / " + Math.round(total / 1048576) : "") + " MB through the proxy…");
  }
  return URL.createObjectURL(new Blob(parts, { type }));
}

async function playUrl(url, kind, headers = {}) {
  const v = player.video;
  stopPlayer();
  const isHls = kind === "hls" || /\.m3u8(\?|$)/i.test(url);
  if (isHls) {
    const Hls = await loadHls();
    if (Hls.isSupported()) {
      const hls = new Hls({ loader: makeLoader(headers), maxBufferLength: 30 });
      player.hls = hls;
      hls.on(Hls.Events.ERROR, (_, e) => {
        if (e.fatal) player.note("Playback error: " + e.type + " / " + e.details, true);
      });
      hls.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
      hls.loadSource(url);
      hls.attachMedia(v);
      return;
    }
  }
  v.src = url;
  if (!isHls) {
    v.onerror = () => {
      v.onerror = null;
      blobFallback(url, headers)
        .then((b) => { v.src = b; v.play().catch(() => {}); player.note("Playing"); })
        .catch((e) => player.note("Playback failed: " + msgOf(e), true));
    };
  }
  v.play().catch(() => {});
}

async function captionUrl(c) {
  const r = await px(c.url, { headers: { accept: "*/*" } }, 30000);
  if (!r.ok) throw new Error("HTTP " + r.status);
  let t = await r.text();
  if (!/^\s*WEBVTT/.test(t)) t = "WEBVTT\n\n" + t.replace(/\r+/g, "").replace(/(\d+:\d+:\d+),(\d+)/g, "$1.$2");
  return URL.createObjectURL(new Blob([t], { type: "text/vtt" }));
}

function setSubs(list) {
  const sel = player.ui.subs;
  player.caps = Array.isArray(list) ? list.filter((c) => c && c.url) : [];
  sel.replaceChildren(new Option("Subtitles off", ""));
  player.caps.forEach((c, i) => sel.append(new Option(c.language || c.id || "Track " + (i + 1), String(i))));
  sel.disabled = player.caps.length === 0;
}

async function applySub(i) {
  const v = player.video;
  v.querySelectorAll("track").forEach((t) => t.remove());
  if (i === "") return;
  const c = player.caps[Number(i)];
  try {
    const u = await captionUrl(c);
    const t = document.createElement("track");
    t.kind = "subtitles";
    t.label = c.language || "Subtitles";
    t.srclang = c.language || "en";
    t.src = u;
    t.default = true;
    v.append(t);
    setTimeout(() => { if (t.track) t.track.mode = "showing"; }, 150);
  } catch (e) {
    player.note("Subtitles: " + msgOf(e), true);
  }
}

async function playStream(st, label) {
  if (!st) throw new Error("Empty stream");
  const { quality, now } = player.ui;
  quality.replaceChildren();
  quality.disabled = true;
  player.quals = null;
  setSubs(st.captions);
  const headers = { ...(st.preferredHeaders || {}), ...(st.headers || {}) };
  player.qHeaders = headers;
  if (st.type === "hls") {
    await playUrl(st.playlist, "hls", headers);
  } else if (st.type === "file") {
    const keys = Object.keys(st.qualities || {}).filter((k) => st.qualities[k] && st.qualities[k].url).sort((a, b) => QORDER(b) - QORDER(a));
    if (!keys.length) throw new Error("No playable qualities");
    player.quals = st.qualities;
    keys.forEach((k) => quality.append(new Option(k === "unknown" ? "Auto" : k, k)));
    quality.disabled = keys.length < 2;
    quality.value = keys[0];
    await playUrl(st.qualities[keys[0]].url, "file", headers);
  } else {
    throw new Error("Unrecognized stream type: " + st.type);
  }
  now.textContent = label;
  player.note("Playing " + label);
}

const setParams = (url, o) => {
  for (const [k, v] of Object.entries(o)) if (v) url.searchParams.set(k, v);
  return url;
};


// Aether's own scraper: the providers library from Aether's vendor chunk (crawled into ref/), run in this page.
// Requests go through the libcurl/wisp proxy above (unrestricted headers), so the NATIVE target applies.
const REF_BASES = [new URL("ref/aether.cx/", location.href).href, "https://cdn.jsdelivr.net/gh/rtischeduler/Aether-@main/ref/aether.cx/"];
const DEFAULT_MAP = { file: "assets/vendor-DTcQ0b48.js", makeProviders: "aP", makeStandardFetcher: "aQ", targets: "aR", proxyFetcher: "aA" };
let providersP = null;

function getProviders() {
  if (providersP) return providersP;
  providersP = (async () => {
    let lastErr;
    for (const base of REF_BASES) {
      try {
        let map = DEFAULT_MAP;
        try { const r = await fetch(base + "providers.json", { cache: "no-cache" }); if (r.ok) map = await r.json(); } catch {}
        const mod = await import(base + map.file);
        const mk = mod[map.makeProviders], std = mod[map.makeStandardFetcher], tg = mod[map.targets];
        if (!mk || !std || !tg) throw new Error("providers export map is out of date, re-run the Crawl ref workflow");
        // Aether's own scrapers (*.raccoonunbutteredbagel.zip, *.aether.cx) sit behind Cloudflare, which 403s anything that does not look like it came from aether.cx; the library reports that as "notfound".
        // A browser on aether.cx sends these itself, so send the same Origin/Referer/UA through libcurl.
        const f = (u, init = {}) => {
          let host = "";
          try { host = new URL(u).hostname; } catch {}
          if (/(^|\.)(raccoonunbutteredbagel\.zip|aether\.cx)$/i.test(host)) {
            let hd = init.headers || {};
            if (typeof Headers !== "undefined" && hd instanceof Headers) hd = Object.fromEntries(hd.entries());
            init = { ...init, headers: { origin: SITE, referer: SITE + "/", "user-agent": navigator.userAgent, accept: "*/*", ...hd } };
          }
          return px(u, init, 60000);
        };
        return mk({ fetcher: std(f), proxiedFetcher: std(f), target: tg.NATIVE });
      } catch (e) { lastErr = e; }
    }
    throw new Error("Could not load Aether's providers library: " + msgOf(lastErr));
  })();
  providersP.catch(() => { providersP = null; });
  return providersP;
}

// getMedia() gives flat strings; the library wants nested numbers.
function toLibMedia(m) {
  const base = { title: m.title, releaseYear: Number(m.releaseYear), tmdbId: m.tmdbId, imdbId: m.imdbId };
  if (m.type === "movie") return { type: "movie", ...base };
  return {
    type: "show", ...base,
    season: { number: Number(m.seasonNumber), tmdbId: m.seasonTmdbId },
    episode: { number: Number(m.episodeNumber), tmdbId: m.episodeTmdbId },
  };
}

async function listSources(type) {
  const P = await getProviders();
  const want = type === "movie" ? "movie" : "show";
  return P.listSources()
    .filter((m) => !Array.isArray(m.mediaTypes) || m.mediaTypes.includes(want))
    .sort((a, b) => (b.rank || 0) - (a.rank || 0));
}

async function startPlayer(type, d, stage) {
  stopPlayer();
  const note = h("div", { class: "pnote" }, "");
  player.note = (t, err) => { note.textContent = t; note.className = "pnote" + (err ? " err" : ""); };
  const video = h("video", { class: "mvideo", controls: "", playsinline: "" });

  const now = h("div", { class: "pnow" }, "");
  const quality = h("select", { class: "psel", disabled: "" });
  const subs = h("select", { class: "psel", disabled: "" });
  subs.append(new Option("Subtitles off", ""));
  player.ui = { quality, subs, now };
  subs.onchange = () => applySub(subs.value);
  quality.onchange = () => {
    const k = quality.value;
    if (!player.quals || !player.quals[k]) return;
    const t = video.currentTime;
    playUrl(player.quals[k].url, "file", player.qHeaders);
    video.addEventListener("loadedmetadata", () => { video.currentTime = t; }, { once: true });

  const chipBtn = (label, fn) => h("button", { class: "pchip", type: "button", onclick: fn }, label);
  const seasonSel = h("select", { class: "psel" });
  const epSel = h("select", { class: "psel", disabled: "" });

  const srcBox = h("div", { class: "plist" }, h("span", { class: "pnote" }, "Loading sources…"));
  const embedBox = h("div", { class: "plist" });
  const embedHead = h("div", { class: "phead", style: "display:none" }, "Embeds");
  const autoBtn = h("button", { class: "pchip", type: "button", disabled: "" }, "Try all sources");
  let seasonData = null;
  const year = String(d.release_date || d.first_air_date || "").slice(0, 4);
  const imdb = d.imdb_id || (d.external_ids && d.external_ids.imdb_id) || "";

  const getMedia = () => {
    if (type === "movie") return { type: "movie", title: d.title || "", releaseYear: year, imdbId: imdb, tmdbId: String(d.id) };
    const ep = seasonData && (seasonData.episodes || []).find((e) => String(e.episode_number) === epSel.value);
    if (!ep) throw new Error("Pick a season and episode first");
    return {
      type: "show",
      title: d.name || "",
      releaseYear: year,
      imdbId: imdb,
      tmdbId: String(d.id),
      seasonNumber: String(seasonData.season_number),
      seasonTmdbId: String(seasonData.id),
      episodeNumber: String(ep.episode_number),
      episodeTmdbId: String(ep.id),
    };
  };

  const loadSeason = async (n) => {
    epSel.replaceChildren();
    epSel.disabled = true;
    try {
      seasonData = await tmdb(`/tv/${d.id}/season/${n}`);
      (seasonData.episodes || []).forEach((e) => epSel.append(new Option(("E" + e.episode_number + " " + (e.name || "")).trim(), String(e.episode_number))));
      epSel.disabled = false;
    } catch (e) {
      player.note("Episodes: " + msgOf(e), true);
    }
  };
  seasonSel.onchange = () => loadSeason(seasonSel.value);

  const showEmbeds = (embeds, name) => {
    embedBox.replaceChildren();
    embedHead.style.display = embeds.length ? "block" : "none";
    embedHead.textContent = "Embeds from " + name;
    embeds.forEach((em) => {
      const b = chipBtn(em.embedId, () => runEmbed(em, name, b));
      embedBox.append(b);
    });
  };

  const runEmbed = async (em, name, btn) => {
    btn.className = "pchip run";
    player.note("Scraping embed " + em.embedId + "…");
    try {
      const P = await getProviders();
      const r = await P.runEmbedScraper({ id: em.embedId, url: em.url });
      const st = r && (Array.isArray(r.stream) ? r.stream[0] : r.stream);
      if (!st) throw new Error("no stream from " + em.embedId);
      await playStream(st, name + " → " + em.embedId);
      btn.className = "pchip ok";
    } catch (e) {
      btn.className = "pchip bad";
      player.note(em.embedId + ": " + msgOf(e), true);
    }
  };

  const runSource = async (s, btn) => {
    btn.className = "pchip run";
    embedBox.replaceChildren();
    embedHead.style.display = "none";
    const name = s.name || s.id;
    player.note("Scraping " + name + "…");
    try {
      const P = await getProviders();
      const r = await P.runSourceScraper({ id: s.id, media: toLibMedia(getMedia()) });
      if (!r) throw new Error("no output");
      const st = Array.isArray(r.stream) ? r.stream[0] : r.stream;
      if (st) {
        await playStream(st, name);
        btn.className = "pchip ok";
        return;
      }
      const embeds = Array.isArray(r.embeds) ? r.embeds : [];
      if (!embeds.length) throw new Error("no streams or embeds");
      btn.className = "pchip ok";
      showEmbeds(embeds, name);
      if (embeds.length === 1) runEmbed(embeds[0], name, embedBox.firstChild);
    } catch (e) {
      btn.className = "pchip bad";
      player.note(name + ": " + msgOf(e), true);
    }
  };

  autoBtn.onclick = async () => {

        player.note(v.id + ": " + (v.status || "working"));
      })("update", v) } });
      const st = r && (Array.isArray(r.stream) ? r.stream[0] : r.stream);
      if (!st) throw new Error("no source produced a stream");
      await playStream(st, [r.sourceId, r.embedId].filter(Boolean).join(" → ") || "Auto");
    } catch (e) {
      player.note("Auto: " + msgOf(e), true);
    } finally {
      autoBtn.disabled = false;
    }
  };

  const loadFem = async () => {
    femBox.replaceChildren();
    if (!febToken) {

      list.forEach((l, i) => {

        if (!url) return;
        any = true;
        const label = typeof l === "string" ? "" : [l.quality, l.label, l.name, l.resolution, l.size].filter((x) => x != null && x !== "").map(String).join(" · ");
        const b = chipBtn(label || "Link " + (i + 1), async () => {
          femBox.querySelectorAll(".pchip").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          quality.replaceChildren();
          quality.disabled = true;
          player.quals = null;
          setSubs(l && l.subtitles);
          try {
            await playUrl(url, /\.m3u8(\?|$)/i.test(url) ? "hls" : "file", {});
            now.textContent = "FEM · " + b.textContent;
            player.note("Playing FEM " + b.textContent);
          } catch (e) {
            player.note("FEM: " + msgOf(e), true);
          }
        });
        femBox.append(b);
      });
      if (!any) femBox.append(h("span", { class: "pnote err" }, "Unrecognized Febbox response: " + JSON.stringify(list[0] === undefined ? null : list[0]).slice(0, 300)));
    } catch (e) {
      femBox.replaceChildren(h("span", { class: "pnote err" }, msgOf(e)));
    }
  };

  const controls = h("div", { class: "pbar" });
  if (type === "tv") controls.append(seasonSel, epSel);
  controls.append(quality, subs);
  stage.replaceChildren(
    video,
    now,
    controls,
    note,
    ...(type === "movie" ? [h("div", { class: "phead" }, "Febbox (FEM)"), femBox] : []),
    h("div", { class: "phead" }, "Sources"),
    h("div", { class: "pbar" }, autoBtn),
    srcBox,
    embedHead,
    embedBox,
  );
  stage.scrollIntoView({ behavior: "smooth", block: "nearest" });
  player.note("Ready. Pick a source below, or try all sources.");

  if (type === "movie") loadFem();

  if (type === "tv") {
    const all = d.seasons || [];
    const seasons = all.filter((s) => s.season_number > 0 && s.episode_count > 0);
    (seasons.length ? seasons : all).forEach((s) => seasonSel.append(new Option("Season " + s.season_number, String(s.season_number))));
    if (seasonSel.value !== "") await loadSeason(seasonSel.value);
  }

  try {
    const list = await listSources(type);
    srcBox.replaceChildren();
    if (!list.length) {
      srcBox.append(h("span", { class: "pnote err" }, "The backend returned no sources."));
      return;

    list.forEach((s) => {
      const b = chipBtn(s.name || s.id, () => runSource(s, b));
      b.dataset.id = s.id;
      srcBox.append(b);
    });
    autoBtn.disabled = false;
  } catch (e) {
    srcBox.replaceChildren(h("span", { class: "pnote err" }, "Could not list sources: " + msgOf(e)));
  }
}

  $("modal").hidden = true;
  document.body.classList.remove("lock");
  $("modal-box").replaceChildren();
}

async function openDetails(type, id, autoplay) {
  const box = $("modal-box");
  $("modal").hidden = false;
  document.body.classList.add("lock");
  const close = h("button", { class: "mclose", type: "button", "aria-label": "Close", onclick: closeModal }, "✕");
  box.replaceChildren(close, h("div", { class: "mload" }, "Loading…"));
  try {
    const d = await tmdb(`/${type}/${id}`, { append_to_response: "credits,external_ids" });
    const stage = h("div", { class: "mstage" });
    const title = d.title || d.name || "";
    const year = String(d.release_date || d.first_air_date || "").slice(0, 4);
    const length = type === "movie"
      ? d.runtime ? `${Math.floor(d.runtime / 60)}h ${d.runtime % 60}m` : ""
      : d.number_of_seasons ? `${d.number_of_seasons} season${d.number_of_seasons === 1 ? "" : "s"}` : "";
    const cast = ((d.credits && d.credits.cast) || []).slice(0, 8).map((c) => c.name).join(", ");
    const back = h("div", { class: "mback" });
    const poster = h("img", { alt: "", decoding: "async" });
    if (d.backdrop_path) setBg(back, d.backdrop_path, "w780");
    if (d.poster_path) blobUrl(IMG + "w342" + d.poster_path).then((u) => { poster.src = u; }).catch(() => {});
    box.replaceChildren(
      close,
      back,
      h("div", { class: "mbody" },
        h("div", { class: "mposter" }, poster),
        h("div", { class: "minfo" },
          h("h2", {}, title),
          d.tagline ? h("div", { class: "tag" }, d.tagline) : null,
          h("div", { class: "meta" },
            d.vote_average ? h("span", { class: "star" }, "★ " + d.vote_average.toFixed(1)) : null,
            year ? h("span", {}, year) : null,
            length ? h("span", {}, length) : null,
            d.status ? h("span", {}, d.status) : null),
          h("div", { class: "genres" }, ...(d.genres || []).map((g) => h("span", {}, g.name))),
          d.overview ? h("p", {}, d.overview) : null,
          cast ? h("div", { class: "cast" }, h("b", {}, "Cast: "), cast) : null,
          h("div", { class: "btns" }, h("button", { class: "btn", type: "button", onclick: () => startPlayer(type, d, stage) }, "▶ Play")))),
      stage);
    if (autoplay) startPlayer(type, d, stage);
  } catch (e) {
    box.replaceChildren(close, h("div", { class: "mload" }, "Could not load details: " + msgOf(e)));
  }
}

$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });
addEventListener("hashchange", () => { if (!$("boot").classList.contains("off")) return; closeModal(); render(); });

async function switchProxy() {
  $("boot").classList.remove("off", "fail");
  say("Switching proxy…");
  try {
    await rotateProxy(log, say);
    await begin();
  } catch (e) {
    fail(e);
  }
}
function fail(e) {
  $("boot").classList.remove("off");
  $("boot").classList.add("fail");
  say("Could not start: " + msgOf(e));
}
async function begin() {
  const boot = $("boot");
  boot.classList.remove("off", "fail");
  say("Starting…");
  try {
    await getProxy({ log, say });
    await getToken();
    boot.classList.add("off");
    render();
  } catch (e) {
    log("[boot] failed", e);
    fail(e);
  }
}
$("retry").onclick = begin;
$("swap").onclick = switchProxy;
$("swapbtn").onclick = switchProxy;
begin();
</script>
</body></html>
