<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Player</title>
<style>
:root{--bg:#120f1d;--panel:#1b1730;--panel2:#241f3d;--line:#2f2850;--ink:#f1eefc;--dim:#a49dbd;--acc:#9b7bff;--acc2:#6c4be0;--danger:#ff7a90;--ok:#7be0a4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 60px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.3rem}
h1 b{color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--dim)}
input,select,button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
input[type=number]{width:96px}
#id{width:140px}
#fem,#tmdb{width:260px}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--acc)}
button.go{background:var(--acc);color:#14102a;border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.tvonly{display:none}
body.tv .tvonly{display:flex}
#stage{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;position:relative;border:1px solid var(--line)}
video{width:100%;height:100%;display:block;background:#000}
#now{position:absolute;left:12px;top:10px;background:rgba(18,15,29,.78);padding:4px 10px;border-radius:999px;font-size:.78rem;pointer-events:none;display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-size:.95rem}
.panel h2 small{color:var(--dim);font-weight:400;margin-left:6px}
.list{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;font-size:.86rem}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.chip.run{border-color:var(--acc)}
.chip.on{background:var(--acc);color:#14102a;border-color:var(--acc)}
.dim{color:var(--dim);font-size:.85rem}
#log{background:#0d0b16;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#cfc8ea}
#log .e{color:var(--danger)}
#log .g{color:var(--ok)}
details>summary{cursor:pointer;color:var(--dim);font-size:.85rem}
details .bar{margin-top:10px}
pre{margin:8px 0 0;background:#0d0b16;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<main>
<h1><b>Aether</b> Player</h1>

<form class="bar" id="form">
<label>TMDB id<input id="id" inputmode="numeric" placeholder="e.g. 557" autocomplete="off"></label>
<label>Type<select id="type"><option value="movie">Movie</option><option value="tv">TV show</option></select></label>
<label class="tvonly">Season<input id="season" type="number" min="0" value="1"></label>
<label class="tvonly">Episode<input id="episode" type="number" min="1" value="1"></label>
<label>Febbox token<input id="fem" type="password" placeholder="ui cookie value" autocomplete="off"></label>
<button class="go" id="load" type="submit">Load</button>
</form>

<details>
<summary>Settings</summary>
<div class="bar">
<label>TMDB read token<input id="tmdb" type="password" placeholder="uses Aether's saved one if present" autocomplete="off"></label>
<label>Scrape backend<input id="backend" style="width:300px"></label>
<label>Proxy hosts (comma separated)<input id="proxies" style="width:380px"></label>
<label>FEM host<input id="femhost" style="width:300px"></label>
<button type="button" id="save">Save settings</button>
<button type="button" id="reset">Reset</button>
</div>
</details>

<div id="stage"><video id="v" controls playsinline crossorigin="anonymous"></video><div id="now"></div></div>

<div class="row">
<label>Quality<select id="quality" disabled></select></label>
<label>Subtitles<select id="subs" disabled><option value="">Off</option></select></label>
</div>

<div class="cols">
<div class="panel">
<h2>Febbox (FEM)<small id="femnote"></small></h2>
<div class="list" id="femlist"><span class="dim">Enter a token and load an id.</span></div>
<details><summary>Raw response</summary><pre id="femraw">-</pre></details>
</div>
<div class="panel">
<h2>Sources<small id="srcnote"></small></h2>
<div class="row"><button type="button" class="chip" id="auto" disabled>Try all sources</button></div>
<div class="list" id="srclist"><span class="dim">Load an id to list sources.</span></div>
<h2 id="embedhead" style="display:none">Embeds</h2>
<div class="list" id="embedlist"></div>
</div>
</div>

<div class="panel">
<h2>Log</h2>
<div id="log"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const DEFAULTS = {
  backend: "https://backend.raccoonunbutteredbagel.zip",
  proxies: "https://just.raccoonunbutteredbagel.zip,https://justice.raccoonunbutteredbagel.zip",
  femhost: "https://fembox.raccoonunbutteredbagel.zip",
};
const TMDB_BASES = ["https://api.themoviedb.org/3", "https://api.tmdb.org/3"];

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { if (v == null || v === "") localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const sess = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { if (v == null || v === "") sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const msgOf = (e) => String((e && e.message) || e);
const log = (t, cls) => {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + "  " + t;
  $("log").append(d);
  $("log").scrollTop = $("log").scrollHeight;
};

const cfg = () => ({
  backend: String(store.get("AP_BACKEND") || DEFAULTS.backend).replace(/\/+$/, ""),
  proxies: String(store.get("AP_PROXIES") || DEFAULTS.proxies).split(",").map((s) => s.trim().replace(/\/+$/, "")).filter(Boolean),
  femhost: String(store.get("AP_FEMHOST") || DEFAULTS.femhost).replace(/\/+$/, ""),
});
let proxyIdx = 0;
const proxy = () => { const p = cfg().proxies; return p.length ? p[proxyIdx % p.length] : ""; };
const nextProxy = () => { proxyIdx++; };

function tmdbToken() {
  const own = $("tmdb").value.trim() || store.get("AE_TMDB");
  if (typeof own === "string" && own.trim()) return own.trim();
  const auto = store.get("AE_TMDB_AUTO");
  if (auto && auto.v) return auto.v;
  return "";
}

async function tmdb(path, params = {}) {
  const t = tmdbToken();
  if (!t) throw new Error("No TMDB token. Open Settings and paste one, or open Aether's main page first so its token is saved.");
  const qs = new URLSearchParams({ language: "en-US", ...params }).toString();
  let err;
  for (const base of TMDB_BASES) {
    try {
      const r = await fetch(base + path + "?" + qs, { headers: { accept: "application/json", Authorization: "Bearer " + t } });
      if (r.status === 401) throw new Error("TMDB rejected the token");
      if (!r.ok) throw new Error("TMDB HTTP " + r.status);
      return await r.json();
    } catch (e) {
      err = e;
      if (/rejected/.test(msgOf(e))) break;
    }
  }
  throw err;
}

async function resolveMedia(type, id, season, episode) {
  if (type === "movie") {
    const d = await tmdb(`/movie/${id}`, { append_to_response: "external_ids" });
    return {
      type: "movie",
      title: d.title || "",
      releaseYear: String(d.release_date || "").slice(0, 4),
      imdbId: d.imdb_id || (d.external_ids && d.external_ids.imdb_id) || "",
      tmdbId: String(d.id),
    };
  }
  const d = await tmdb(`/tv/${id}`, { append_to_response: "external_ids" });
  const s = await tmdb(`/tv/${id}/season/${season}`);
  const ep = (s.episodes || []).find((x) => Number(x.episode_number) === Number(episode));
  if (!ep) throw new Error(`Season ${season} episode ${episode} not found on TMDB`);
  return {
    type: "show",
    title: d.name || "",
    releaseYear: String(d.first_air_date || "").slice(0, 4),
    imdbId: (d.external_ids && d.external_ids.imdb_id) || "",
    tmdbId: String(d.id),
    seasonNumber: String(season),
    seasonTmdbId: String(s.id),
    episodeNumber: String(episode),
    episodeTmdbId: String(ep.id),
  };
}

const setParams = (url, o) => { for (const [k, v] of Object.entries(o)) if (v) url.searchParams.set(k, v); return url; };

let forceProxy = false;
const viaProxy = (p, u) => `${p}/?destination=${encodeURIComponent(u)}`;
// Backend sends 403 to direct cross-origin browser calls; the ref app goes through the CORS proxy (?destination=). Try direct, then each proxy, and remember what worked.
// Proxies forward X-Origin/X-Referer as Origin/Referer; the backend 403s anything that does not look like aether.cx. (Only on proxied tries: custom headers on a direct call would force a failing CORS preflight.)
const SPOOF = { "X-Origin": "https://aether.cx", "X-Referer": "https://aether.cx/" };
const hdrs = (t, u, accept) => (t === u ? { accept } : { accept, ...SPOOF });
const backendUrls = (u) => {
  const px = cfg().proxies.map((p) => viaProxy(p, u));
  return forceProxy ? [...px, u] : [u, ...px];
};
async function backendFetch(u, accept = "application/json", ms = 30000) {
  const tried = [];
  for (const t of backendUrls(u)) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(t, { headers: hdrs(t, u, accept), signal: ctl.signal });
      if (r.ok) { if (t !== u) forceProxy = true; return r; }
      let body = "";
      try { body = (await r.text()).replace(/\s+/g, " ").slice(0, 80); } catch {}
      tried.push((t === u ? "direct" : new URL(t).host) + ": HTTP " + r.status + (body ? " " + body : ""));
    } catch (e) {
      tried.push((t === u ? "direct" : new URL(t).host) + ": " + (e && e.name === "AbortError" ? "timed out" : msgOf(e)));
    } finally { clearTimeout(timer); }
  }
  throw new Error(tried.join(" | ") || "No backend reachable");
}

function parseSseBlock(block) {
  let name = "message";
  const data = [];
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) name = line.slice(6).trim();
    else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
  }
  let v = {};
  try { v = data.length ? JSON.parse(data.join("\n")) : {}; } catch {}
  return { name, v, hasData: data.length > 0 };
}

async function sse(url, onUpdate, ms = 90000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  let err;
  try {
    for (const t of backendUrls(url)) {
      try {
        const r = await fetch(t, { headers: hdrs(t, url, "text/event-stream"), signal: ctl.signal });
        if (!r.ok) { err = new Error("Backend HTTP " + r.status); continue; }
        if (t !== url) forceProxy = true;
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        for (;;) {
          const { done, value } = await reader.read();
          buf += dec.decode(value || new Uint8Array(), { stream: !done }).replace(/\r\n?/g, "\n");
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const b = parseSseBlock(buf.slice(0, i));
            buf = buf.slice(i + 2);
            if (b.name === "completed") return b.v;
            if (b.name === "noOutput") return null;
            if (b.name === "error") {
              const e = new Error(b.hasData ? b.v.message || b.v.name || "scrape error" : "Scrape backend error");
              e.fatal = true;
              throw e;
            }
            if (onUpdate && ["init", "start", "update"].includes(b.name)) onUpdate(b.name, b.v);
          }
          if (done) break;
        }
        err = new Error("Scrape stream ended without a result");
      } catch (e) {
        if (e && e.fatal) throw e;
        if (ctl.signal.aborted) throw new Error("Scrape timed out");
        err = e;
      }
    }
  } finally { clearTimeout(timer); ctl.abort(); }
  throw err || new Error("Could not connect to the scrape backend");
}

const hlsUrl = (u, headers) => {
  const p = proxy();
  if (!p) return u;
  const q = "url=" + encodeURIComponent(u) + "&headers=" + encodeURIComponent(JSON.stringify(headers || {}));
  return `${p}/m3u8-proxy?${q}`;
};

const QORDER = (k) => (k === "4k" ? 2160 : k === "unknown" ? 0 : parseInt(k, 10) || 1);

const player = { hls: null, qualities: null, captions: [], current: null };
const video = $("v");

function stopPlayback() {
  if (player.hls) { player.hls.destroy(); player.hls = null; }
  video.removeAttribute("src");
  video.querySelectorAll("track").forEach((t) => t.remove());
  video.load();
}

function playUrl(url, kind) {
  stopPlayback();
  const isHls = kind === "hls" || /\.m3u8(\?|$)/i.test(url);
  if (isHls && window.Hls && Hls.isSupported()) {
    const h = new Hls({ maxBufferLength: 30 });
    player.hls = h;
    h.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) log("HLS error: " + d.type + " / " + d.details, "e");
    });
    h.loadSource(url);
    h.attachMedia(video);
    h.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
    return;
  }
  video.src = url;
  video.play().catch(() => {});
}

function setNow(t) {
  const n = $("now");
  n.textContent = t || "";
  n.style.display = t ? "block" : "none";
}

function srtToVtt(s) {
  return "WEBVTT\n\n" + s.replace(/\r+/g, "").replace(/(\d+:\d+:\d+),(\d+)/g, "$1.$2");
}

async function loadCaption(c) {
  const urls = [c.url];
  const p = proxy();
  if (p) urls.push(`${p}/?destination=${encodeURIComponent(c.url)}`);
  let text = null;
  for (const u of urls) {
    try {
      const r = await fetch(u);
      if (r.ok) { text = await r.text(); break; }
    } catch {}
  }
  if (text == null) throw new Error("subtitle fetch failed");
  if (!/^\s*WEBVTT/.test(text)) text = srtToVtt(text);
  return URL.createObjectURL(new Blob([text], { type: "text/vtt" }));
}

function setSubs(list) {
  player.captions = list || [];
  const sel = $("subs");
  sel.replaceChildren(new Option("Off", ""));
  player.captions.forEach((c, i) => sel.append(new Option(c.language || c.id || "Track " + (i + 1), String(i))));
  sel.disabled = player.captions.length === 0;
}

$("subs").onchange = async () => {
  video.querySelectorAll("track").forEach((t) => t.remove());
  const i = $("subs").value;
  if (i === "") return;
  const c = player.captions[Number(i)];
  try {
    const u = await loadCaption(c);
    const t = document.createElement("track");
    t.kind = "subtitles";
    t.label = c.language || "Subtitles";
    t.srclang = c.language || "en";
    t.src = u;
    t.default = true;
    video.append(t);
    t.addEventListener("load", () => { t.track.mode = "showing"; });
    setTimeout(() => { if (t.track) t.track.mode = "showing"; }, 200);
  } catch (e) {
    log("Subtitles: " + msgOf(e), "e");
  }
};

function playStream(st, label) {
  if (!st) throw new Error("Empty stream");
  const q = $("quality");
  q.replaceChildren();
  q.disabled = true;
  player.qualities = null;
  setSubs(st.captions || []);
  if (st.type === "hls") {
    const headers = { ...(st.preferredHeaders || {}), ...(st.headers || {}) };
    playUrl(hlsUrl(st.playlist, headers), "hls");
  } else if (st.type === "file") {
    const keys = Object.keys(st.qualities || {}).filter((k) => st.qualities[k] && st.qualities[k].url).sort((a, b) => QORDER(b) - QORDER(a));
    if (!keys.length) throw new Error("No playable qualities");
    player.qualities = st.qualities;
    keys.forEach((k) => q.append(new Option(k === "unknown" ? "Auto" : k, k)));
    q.disabled = keys.length < 2;
    q.value = keys[0];
    playUrl(st.qualities[keys[0]].url, "file");
  } else {
    throw new Error("Unrecognized stream type: " + st.type);
  }
  setNow(label);
  log("Playing " + label, "g");
}

$("quality").onchange = () => {
  const k = $("quality").value;
  if (player.qualities && player.qualities[k]) {
    const t = video.currentTime;
    playUrl(player.qualities[k].url, "file");
    video.addEventListener("loadedmetadata", () => { video.currentTime = t; }, { once: true });
  }
};

const fieldUrl = (o) => o && (o.url || o.link || o.file || o.src || o.stream || o.playlist || "");
const fieldLabel = (o, i) => {
  const parts = [o.quality, o.label, o.name, o.resolution, o.size].filter((x) => x != null && x !== "").map(String);
  return parts.length ? parts.join(" · ") : "Link " + (i + 1);
};

async function loadFem(id, token) {
  const list = $("femlist");
  const note = $("femnote");
  const raw = $("femraw");
  note.textContent = "";
  if (!token) {
    list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "No Febbox token set." }));
    raw.textContent = "-";
    return;
  }
  list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "Fetching…" }));
  let r;
  try {
    r = await fetch(`${cfg().femhost}/movie/${encodeURIComponent(id)}?ui=${encodeURIComponent(token)}`);
  } catch (e) {
    list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "FEM unreachable: " + msgOf(e) }));
    log("FEM fetch failed: " + msgOf(e), "e");
    return;
  }
  if (!r.ok) {
    const bad = r.status === 502 || r.status === 503 ? "FEM API is down" : "FEM HTTP " + r.status + " (token may be invalid)";
    list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: bad }));
    log(bad, "e");
    return;
  }
  let d;
  try { d = await r.json(); } catch { d = null; }
  raw.textContent = JSON.stringify(d, null, 2);
  const links = d && (d.links || d.sources);
  if (!Array.isArray(links) || !links.length) {
    list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "No links returned." }));
    return;
  }
  note.textContent = links.length + " found";
  list.replaceChildren();
  links.forEach((l, i) => {
    const url = typeof l === "string" ? l : fieldUrl(l);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = typeof l === "string" ? "Link " + (i + 1) : fieldLabel(l, i);
    b.disabled = !url;
    b.onclick = () => {
      document.querySelectorAll("#femlist .chip").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      $("quality").replaceChildren();
      $("quality").disabled = true;
      setSubs(Array.isArray(l && l.subtitles) ? l.subtitles : []);
      playUrl(url, /\.m3u8(\?|$)/i.test(url) ? "hls" : "file");
      setNow("FEM · " + b.textContent);
      log("Playing FEM " + b.textContent, "g");
    };
    list.append(b);
  });
}

let media = null;
let sources = [];

function srcSupports(m, type) {
  if (!Array.isArray(m.mediaTypes)) return true;
  return m.mediaTypes.includes(type === "movie" ? "movie" : "show");
}

async function loadSources(type) {
  const note = $("srcnote");
  const list = $("srclist");
  note.textContent = "";
  try {
    const r = await backendFetch(cfg().backend + "/metadata");
    const all = (await r.json());
    const flat = (Array.isArray(all) ? all.flat(3) : []).filter((m) => m && m.id);
    const hasType = flat.some((m) => m.type);
    sources = flat.filter((m) => (hasType ? m.type === "source" : true) && srcSupports(m, type));
    sources.sort((a, b) => (b.rank || 0) - (a.rank || 0));
  } catch (e) {
    sources = [];
    list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "Could not list sources: " + msgOf(e) }));
    log("Source list failed: " + msgOf(e), "e");
    return;
  }
  if (!sources.length) {
    list.replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "Backend returned no sources." }));
    return;
  }
  note.textContent = sources.length + " available";
  list.replaceChildren();
  sources.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.dataset.id = s.id;
    b.textContent = s.name || s.id;
    b.onclick = () => runSource(s, b);
    list.append(b);
  });
  $("auto").disabled = false;
}

function mediaQuery(url, extra) {
  return setParams(url, { ...media, ...extra });
}

function showEmbeds(embeds, sourceName) {
  const head = $("embedhead");
  const list = $("embedlist");
  list.replaceChildren();
  head.style.display = embeds.length ? "block" : "none";
  head.textContent = "Embeds from " + sourceName;
  embeds.forEach((em) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = em.embedId;
    b.onclick = () => runEmbed(em, sourceName, b);
    list.append(b);
  });
}

async function runEmbed(em, sourceName, btn) {
  btn.className = "chip run";
  log("Scraping embed " + em.embedId + "…");
  try {
    const url = setParams(new URL(cfg().backend + "/scrape/embed"), { id: em.embedId, url: em.url });
    const r = await sse(url.toString());
    const st = r && (Array.isArray(r.stream) ? r.stream[0] : r.stream);
    if (!st) throw new Error("No stream from " + em.embedId);
    playStream(st, sourceName + " → " + em.embedId);
    btn.className = "chip ok";
  } catch (e) {
    btn.className = "chip bad";
    log("Embed " + em.embedId + ": " + msgOf(e), "e");
  }
}

async function runSource(s, btn) {
  if (!media) return;
  btn.className = "chip run";
  $("embedlist").replaceChildren();
  $("embedhead").style.display = "none";
  log("Scraping source " + (s.name || s.id) + "…");
  try {
    const url = mediaQuery(new URL(cfg().backend + "/scrape/source"), { id: s.id });
    const r = await sse(url.toString());
    if (!r) throw new Error("no output");
    const st = Array.isArray(r.stream) ? r.stream[0] : r.stream;
    if (st) {
      playStream(st, s.name || s.id);
      btn.className = "chip ok";
      return;
    }
    const embeds = Array.isArray(r.embeds) ? r.embeds : [];
    if (!embeds.length) throw new Error("no streams or embeds");
    btn.className = "chip ok";
    showEmbeds(embeds, s.name || s.id);
    if (embeds.length === 1) runEmbed(embeds[0], s.name || s.id, $("embedlist").firstChild);
  } catch (e) {
    btn.className = "chip bad";
    log((s.name || s.id) + ": " + msgOf(e), "e");
  }
}

$("auto").onclick = async () => {
  if (!media) return;
  const b = $("auto");
  b.disabled = true;
  log("Trying all sources…");
  try {
    const url = mediaQuery(new URL(cfg().backend + "/scrape"), {});
    const r = await sse(url.toString(), (n, d) => {
      if (n === "update" && d && d.id) {
        const chip = document.querySelector(`#srclist .chip[data-id="${CSS.escape(d.id)}"]`);
        if (chip) chip.className = "chip " + (d.status === "success" ? "ok" : d.status === "failure" || d.status === "notfound" ? "bad" : "run");
        log((d.id || "?") + ": " + (d.status || "update"));
      }
    }, 180000);
    const st = r && (Array.isArray(r.stream) ? r.stream[0] : r.stream);
    if (!st) throw new Error("no source produced a stream");
    const name = [r.sourceId, r.embedId].filter(Boolean).join(" → ");
    playStream(st, name || "Auto");
  } catch (e) {
    log("Auto: " + msgOf(e), "e");
  } finally {
    b.disabled = false;
  }
};

async function load() {
  const id = $("id").value.trim().replace(/\D/g, "");
  const type = $("type").value;
  if (!id) { log("Enter a TMDB id", "e"); return; }
  const token = $("fem").value.trim().replace(/^ui=/i, "");
  sess.set("AE_FEBBOX", token);
  history.replaceState(null, "", "?" + new URLSearchParams({ id, type, ...(type === "tv" ? { s: $("season").value, e: $("episode").value } : {}) }));
  $("load").disabled = true;
  stopPlayback();
  setNow("");
  setSubs([]);
  $("embedlist").replaceChildren();
  $("embedhead").style.display = "none";
  $("auto").disabled = true;
  media = null;
  log(`Loading ${type} ${id}…`);
  try {
    media = await resolveMedia(type, id, $("season").value, $("episode").value);
    document.title = media.title + " · Aether Player";
    log(`${media.title} (${media.releaseYear || "?"}) imdb:${media.imdbId || "?"}`, "g");
  } catch (e) {
    log("Metadata: " + msgOf(e), "e");
    $("load").disabled = false;
    return;
  }
  const femP = type === "movie"
    ? loadFem(id, token)
    : Promise.resolve($("femlist").replaceChildren(Object.assign(document.createElement("span"), { className: "dim", textContent: "FEM is only wired for movies." })));
  await Promise.all([femP, loadSources(type)]);
  $("load").disabled = false;
}

$("form").onsubmit = (e) => { e.preventDefault(); load(); };
$("type").onchange = () => document.body.classList.toggle("tv", $("type").value === "tv");

$("save").onclick = () => {
  store.set("AP_BACKEND", $("backend").value.trim() === DEFAULTS.backend ? "" : $("backend").value.trim());
  store.set("AP_PROXIES", $("proxies").value.trim() === DEFAULTS.proxies ? "" : $("proxies").value.trim());
  store.set("AP_FEMHOST", $("femhost").value.trim() === DEFAULTS.femhost ? "" : $("femhost").value.trim());
  const t = $("tmdb").value.trim();
  if (t) store.set("AE_TMDB", t);
  log("Settings saved", "g");
};
$("reset").onclick = () => {
  ["AP_BACKEND", "AP_PROXIES", "AP_FEMHOST"].forEach((k) => store.set(k, ""));
  $("backend").value = DEFAULTS.backend;
  $("proxies").value = DEFAULTS.proxies;
  $("femhost").value = DEFAULTS.femhost;
  log("Settings reset");
};

(function init() {
  const c = cfg();
  $("backend").value = c.backend;
  $("proxies").value = c.proxies.join(",");
  $("femhost").value = c.femhost;
  $("fem").value = String(sess.get("AE_FEBBOX") || "");
  const q = new URLSearchParams(location.search);
  if (q.get("type") === "tv") { $("type").value = "tv"; document.body.classList.add("tv"); }
  if (q.get("s")) $("season").value = q.get("s");
  if (q.get("e")) $("episode").value = q.get("e");
  if (q.get("id")) { $("id").value = q.get("id"); load(); }
})();
</script>
